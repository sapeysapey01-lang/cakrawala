[build]
builder = "RAILPACK"
buildCommand = "npm run build --workspace frontend"
watchPatterns = ["/frontend/**", "/package.json", "/package-lock.json"]

[deploy]
startCommand = "npm run start --workspace frontend"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
